# Tells the Homebrew tap about a new tag right away, so the formula follows
# within a minute. The tap also checks every hour, in case this fails.
# Needs the secret TAP_TOKEN: a token that can write to Hypefury/homebrew-tap.
name: Notify the Homebrew tap
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send the tag to the tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if [ -z "$GH_TOKEN" ]; then echo "TAP_TOKEN is not set." >&2; exit 1; fi
          gh api repos/Hypefury/homebrew-tap/dispatches \
            -f event_type=blackroija-tag -f "client_payload[tag]=$TAG"
